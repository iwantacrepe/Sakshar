# Sakshar conda environment
#   conda env create -f environment.yml
#   conda activate sakshar
#
# numpy / OpenCV intentionally come from pip (not conda-forge): paddleocr pulls
# opencv from PyPI and would clobber conda's cv2 build -> "DLL load failed" on Windows.
name: sakshar
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - tesseract>=5.3     # no admin needed; add hin/mar/pan via scripts/setup_tessdata.py
  - pip:
      # --- numerics / imaging (pinned first) ---
      - numpy<2.0
      - opencv-python-headless>=4.9,<4.11
      # --- web ---
      - fastapi>=0.111
      - uvicorn[standard]>=0.30
      - jinja2>=3.1
      - python-multipart>=0.0.9
      - pydantic>=2.7
      - pydantic-settings>=2.3
      - sse-starlette>=2.1
      # --- document pipeline ---
      - openai>=1.40
      - pymupdf>=1.24
      - pillow>=10.3
      - rapidfuzz>=3.9
      - rank-bm25>=0.2.2
      - lingua-language-detector>=2.0
      - pytesseract>=0.3.10
      # --- OCR (CPU) ---
      # paddle 3.x: 2.6 pins protobuf<=3.20 on Windows, which conflicts with parler-tts (protobuf>=4)
      - paddlepaddle==3.0.0
      - paddleocr>=3.1,<3.2
      - paddlex>=3.1,<3.2   # paddleocr 3.1 breaks against newer paddlex APIs
      # --- voice (CUDA 12.4 wheels; driver supports 12.5) ---
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.4.1
      - torchaudio==2.4.1
      - transformers>=4.44,<4.47
      - sentencepiece==0.2.0   # 0.2.1+ needs protobuf>=5; descript-audiotools (parler-tts) needs <5
      - faster-whisper>=1.0.3
      - soundfile>=0.12
      # --- dev ---
      - pytest>=8.2
      - httpx>=0.27
      # --- last: these must not override the transformers pin ---
      - IndicTransToolkit
      - parler-tts @ git+https://github.com/huggingface/parler-tts.git
