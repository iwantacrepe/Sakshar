[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sakshar"
version = "0.1.0"
description = "OCR + voice assistant that explains Indian government forms and land records in plain language"
requires-python = ">=3.11"
# Dependencies are managed by environment.yml (conda env "sakshar").

[tool.setuptools.packages.find]
include = ["sakshar*"]

[tool.setuptools.package-data]
sakshar = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
